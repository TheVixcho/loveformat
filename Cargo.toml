[package]
name = "loveformat"
version = "0.1.0"
edition = "2021"
authors = ["LoveFormat Contributors"]
description = "Conversor de formatos y transcodificador de video interactivo, visual y ultrarrápido para la terminal."
readme = "README.md"
license = "MIT"
repository = "https://github.com/TheVixcho/loveformat"
homepage = "https://github.com/TheVixcho/loveformat"
keywords = ["video", "transcoder", "ffmpeg", "cli", "tui"]
categories = ["command-line-utilities", "multimedia", "multimedia::video"]

[[bin]]
name = "loveformat"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "color"] }
console = "0.15"
dirs = "5.0"
indicatif = "0.17"
inquire = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", default-features = true }
which = "6.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
