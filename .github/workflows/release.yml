name: Release Binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: loveformat-linux-x86_64.tar.gz
            bin_name: loveformat
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_name: loveformat-linux-arm64.tar.gz
            bin_name: loveformat
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: loveformat-windows-x86_64.zip
            bin_name: loveformat.exe
          - os: macos-13
            target: x86_64-apple-darwin
            archive_name: loveformat-macos-intel.tar.gz
            bin_name: loveformat
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: loveformat-macos-apple-silicon.tar.gz
            bin_name: loveformat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} dist/
          cp README.md LICENSE dist/
          tar -czf ${{ matrix.archive_name }} -C dist .

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.bin_name }} dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive_name }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
          generate_release_notes: true
